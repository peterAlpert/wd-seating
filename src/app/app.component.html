<router-outlet></router-outlet>

@if (showFloatingNavigation) {
<div class="floating-navigation" dir="rtl">

    <button type="button" class="floating-btn back-btn" (click)="goBack()" aria-label="رجوع" title="رجوع">
        <span class="back-icon">➜</span>
    </button>

    <button type="button" class="floating-btn dashboard-btn" (click)="goToDashboard()" aria-label="لوحة التحكم"
        title="لوحة التحكم">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
            <rect x="13" y="3" width="8" height="5" rx="1.5"></rect>
            <rect x="13" y="10" width="8" height="11" rx="1.5"></rect>
            <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
        </svg>
    </button>

</div>
}
